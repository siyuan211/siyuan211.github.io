<!DOCTYPE html><html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的科技感首页</title>
  <style>
    /* 深蓝渐变背景 + glass 卡片样式 */
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      color: #fff;
      overflow-x: hidden;
      scroll-behavior: smooth;
      background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
    }.notice-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: linear-gradient(90deg, #004e92, #000428);
  color: #fff;
  font-size: 1rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
  z-index: 1200;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  user-select: none;
}

.notice-bar .close-btn {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: #fff;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  transition: color 0.3s ease;
  user-select: none;
}

.notice-bar .close-btn:hover,
.notice-bar .close-btn:focus {
  color: #ff6f61;
  outline: none;
}

nav.navbar {
  position: fixed;
  top: 48px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
}

nav .nav-logo {
  color: #00bfff;
  font-weight: bold;
  font-size: 1.5rem;
  text-decoration: none;
}

nav .nav-links a {
  color: #fff;
  margin-left: 1.5rem;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}

nav .nav-links a:hover {
  color: #00bfff;
}

.overlay {
  padding-top: 7.5rem;
  padding-bottom: 3rem;
  max-width: 960px;
  margin: 0 auto;
  text-align: center;
}

h1 {
  font-size: 3rem;
  margin-bottom: 1rem;
}

p.intro {
  font-size: 1.2rem;
  margin-bottom: 2rem;
}

.btn {
  padding: 0.8rem 1.5rem;
  background: linear-gradient(90deg, #00bfff, #007acc);
  border-radius: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 1rem;
  box-shadow: 0 6px 12px rgba(0,191,255,0.6);
  transition: background 0.3s ease, box-shadow 0.3s ease;
  margin-bottom: 3rem;
  display: inline-block;
}

.btn:hover {
  background: linear-gradient(90deg, #007acc, #005f99);
  box-shadow: 0 8px 16px rgba(0,122,204,0.7);
}

.section {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1.5rem;
}

.card {
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 1.5rem;
  width: 260px;
  box-shadow: 0 8px 24px rgba(0, 191, 255, 0.15);
  transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.3s ease;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 30px rgba(0, 191, 255, 0.4);
  background: rgba(255, 255, 255, 0.08);
}

.card h3 {
  color: #fff;
  margin-bottom: 0.5rem;
}

.card p {
  font-size: 0.95rem;
  color: #ddd;
  margin-bottom: 0.5rem;
}

.btn-link {
  color: #87cefa;
  text-decoration: underline;
  font-size: 0.95rem;
}

@media screen and (max-width: 600px) {
  .overlay {
    padding-top: 7rem;
  }
  h1 { font-size: 2rem; }
  .section { flex-direction: column; }
  .card { width: 90%; }
}

  </style>
</head>
<body>
  <div class="notice-bar">
    欢迎访问我的博客！科技感界面启动中...
    <button class="close-btn" onclick="this.parentElement.style.display='none'">×</button>
  </div>  <nav class="navbar">
    <a href="#" class="nav-logo">我的博客</a>
    <div class="nav-links">
      <a href="#about">关于</a>
      <a href="#projects">项目</a>
      <a href="#contact">联系</a>
    </div>
  </nav>  <main class="overlay">
    <h1>科技灵动首页</h1>
    <p class="intro">打造如 Apple Glass 一般的高端感受。</p>
    <a href="#projects" class="btn">了解更多</a><div class="section">
  <div class="card">
    <h3>博客文章</h3>
    <p>查看最新更新和教程内容。</p>
    <a class="btn-link" href="#">进入文章</a>
  </div>

  <div class="card">
    <h3>个人项目</h3>
    <p>展示我构建的一些项目和工具。</p>
    <a class="btn-link" href="#">查看项目</a>
  </div>

  <div class="card">
    <h3>联系我</h3>
    <p>通过邮箱或社交媒体与我取得联系。</p>
    <a class="btn-link" href="#">联系方式</a>
  </div>
</div>

  </main>
</body>
</html>
